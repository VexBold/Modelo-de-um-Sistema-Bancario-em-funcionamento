<style>
/* ==========================================================================
   RootBank · folha de estilos
   Ordem: tokens e base → componentes (cartão 3D, campos, modal, carrosséis)
   → telas (início, login) → responsivo (celular, tablet, computador)
   → CAMADA FINAL (identidade visual de banco digital, que prevalece sobre o resto).
   Procure por "/* =====" para navegar.
   ========================================================================== */
:root {
  --bg:#09090b;
  --bg2:#111113;
  --card:#161619;
  --text:#fafafa;
  --muted:#8d8d96;
  --line:#26262b;
  --gold:#fafafa;
  --gold2:#a1a1aa;
  --pos:#5fe0b7;
  --neg:#ff8a80;
  --ink:#09090b;
  --ray:255,255,255;
  --rayA:.2;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

:root[data-theme=light] {
  --bg:#f5f5f6;
  --bg2:#fff;
  --card:#fff;
  --text:#0a0a0b;
  --muted:#6b6b74;
  --line:#e2e2e6;
  --gold:#18181b;
  --gold2:#52525b;
  --pos:#0d8a63;
  --neg:#c9402f;
  --ink:#fafafa;
  --ray:0,0,0;
  --rayA:.07;
  color-scheme:light
}

* {
  box-sizing:border-box;
  margin:0
}

html,body {
  height:100%
}

body {
  background:var(--bg);
  color:var(--text);
  font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums lining-nums
}

button,input {
  font:inherit;
  color:inherit
}

button {
  cursor:pointer;
  background:none;
  border:0
}

:focus-visible {
  outline:2px solid var(--gold);
  outline-offset:2px
}

#app {
  max-width:440px;
  margin:0 auto;
  min-height:100%;
  padding:20px 18px 110px
}

.row {
  display:flex;
  align-items:center;
  gap:12px
}

.sp {
  justify-content:space-between
}

.muted {
  color:var(--muted);
  font-size:13px
}

.pos {
  color:var(--pos)
}

.neg {
  color:var(--neg)
}

.ic {
  width:22px;
  height:22px;
  flex:none
}

.logo {
  display:inline-grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--ink);
  font:700 15px ui-monospace,monospace
}

h1 {
  font-size:28px;
  line-height:1.15;
  margin:18px 0 6px;
  font-weight:600;
  letter-spacing:-.04em
}

h2 {
  font-size:17px;
  margin:26px 0 12px;
  font-weight:600;
  letter-spacing:-.025em
}

.box {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px
}

.bal {
  padding:22px;
  border-radius:26px;
  background:linear-gradient(160deg,var(--bg2),var(--card));
  border:1px solid var(--line)
}

.bal b {
  display:block;
  font-size:36px;
  font-weight:700;
  letter-spacing:-.04em;
  margin:4px 0 8px
}

.acts {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:16px
}

.act {
  display:grid;
  justify-items:center;
  gap:6px;
  padding:12px 4px;
  border-radius:16px;
  background:var(--bg2);
  border:1px solid var(--line);
  font-size:12px
}

.act:hover {
  border-color:var(--gold)
}

.eye {
  padding:8px;
  border-radius:50%;
  background:var(--bg2);
  border:1px solid var(--line)
}

.av {
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--card);
  border:1px solid var(--gold);
  font-weight:700
}

.bar {
  height:8px;
  border-radius:8px;
  background:var(--line);
  overflow:hidden;
  margin-top:6px
}

.bar i {
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--gold2),var(--gold))
}

.tx {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  padding:12px 0;
  border-bottom:1px solid var(--line)
}

.tx .e {
  width:40px;
  height:40px;
  border-radius:14px;
  background:var(--bg2);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-size:18px;
  flex:none
}

.tx .m {
  flex:1;
  min-width:0
}

.tx .m span {
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.day {
  margin:18px 0 2px;
  font-size:13px;
  color:var(--muted)
}

nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:440px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:var(--bg2);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))
}

nav a {
  display:grid;
  justify-items:center;
  gap:2px;
  padding:6px;
  font-size:11px;
  color:var(--muted);
  text-decoration:none;
  border-radius:12px
}

nav a.on {
  color:var(--gold)
}

input {
  width:100%;
  padding:14px;
  border-radius:14px;
  background:var(--bg2);
  border:1px solid var(--line);
  margin-top:10px
}

input::placeholder {
  color:var(--muted)
}

.btn {
  width:100%;
  padding:15px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--ink);
  font-weight:700;
  margin-top:14px
}

.btn.alt {
  background:var(--bg2);
  color:var(--text);
  border:1px solid var(--line)
}

.tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--bg2);
  border-radius:14px;
  padding:4px;
  margin:22px 0 6px
}

.tabs button {
  padding:10px;
  border-radius:11px;
  color:var(--muted)
}

.tabs .on {
  background:var(--card);
  color:var(--text)
}

.chips {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 2px
}

.chip {
  flex:none;
  padding:7px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  font-size:13px;
  color:var(--muted)
}

.chip.on {
  background:var(--gold);
  color:var(--ink);
  border-color:var(--gold)
}

.err {
  color:var(--neg);
  font-size:13px;
  min-height:18px;
  margin-top:10px
}

.card3d.flip {
  transform:rotateY(180deg)
}

.face.back {
  transform:rotateY(180deg)
}

.face.off {
  filter:grayscale(1) brightness(.7)
}

.num {
  font:600 19px ui-monospace,monospace;
  letter-spacing:.08em
}

.list li {
  list-style:none;
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--line)
}

.list {
  padding:0
}

#toast {
  position:fixed;
  left:50%;
  bottom:calc(86px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--text);
  color:var(--bg);
  padding:10px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:30;
  max-width:90%
}

#toast.on {
  opacity:1
}

#modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20
}

#modal.on {
  display:flex
}

.rec {
  width:100%;
  max-height:92vh;
  overflow:auto;
  max-width:440px;
  background:var(--card);
  border-radius:26px 26px 0 0;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));
  border-top:2px dashed var(--gold)
}

.rec dl {
  display:grid;
  grid-template-columns:auto 1fr;
  gap:8px 16px;
  margin:16px 0;
  font-size:14px
}

.rec dt {
  color:var(--muted)
}

.rec dd {
  text-align:right;
  word-break:break-all
}

.foot {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:30px
}

@media(min-width:600px) {
  body {
    padding:20px 0
  }
  #app {
    border:1px solid var(--line);
    border-radius:30px;
    min-height:calc(100% - 20px)
  }
}

/* ===== Chave "Reduzir animações" (Mais > Preferências) ===== */
:root[data-motion=off] *,:root[data-motion=off] *::before,:root[data-motion=off] *::after{transition:none!important;animation:none!important}


/* ===== Cartão com inclinação 3D ===== */
.scene {
  perspective:1200px;
  margin:6px 0 16px;
  display:flex;
  justify-content:center
}

.tilt {
  width:100%;
  max-width:360px;
  aspect-ratio:16/9;
  transition:transform .15s ease-out;
  transform-style:preserve-3d;
  will-change:transform
}

.tilt.rest {
  transition:transform .5s ease-out
}

.card3d {
  position:relative;
  width:100%;
  height:100%;
  transition:transform .6s;
  transform-style:preserve-3d;
  cursor:pointer
}

.card3d.flip {
  transform:rotateY(180deg)
}

.face {
  position:absolute;
  inset:0;
  border-radius:16px;
  padding:22px;
  backface-visibility:hidden;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:linear-gradient(135deg,#f5f5f5,#e5e5e5 50%,#d4d4d4);
  color:#171717;
  box-shadow:0 8px 16px rgba(0,0,0,.08),0 16px 32px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.04),inset 0 0 0 1px rgba(0,0,0,.06)
}

:root[data-theme=dark] .face {
  background:linear-gradient(135deg,#262626,#0a0a0a 50%,#171717);
  color:#f5f5f5;
  box-shadow:0 8px 16px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.1),inset 0 0 0 1px rgba(255,255,255,.06)
}

.face.back {
  transform:rotateY(180deg)
}

.face.off {
  filter:grayscale(1) brightness(.7)
}

.cl {
  font-size:12px;
  opacity:.6
}

.cn {
  font:500 14px ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em
}

.strip {
  height:36px;
  background:#000;
  margin:-22px -22px 0
}

.logo.sm {
  width:28px;
  height:28px;
  border-radius:9px;
  font-size:12px
}

@media(max-width:380px) {
  .face {
    padding:16px
  }
  .strip {
    margin:-16px -16px 0
  }
  .cn {
    font-size:12px
  }
}


/* ===== Botão de copiar ===== */
.cp {
  display:inline-flex;
  align-items:center;
  gap:6px;
  vertical-align:middle;
  margin-left:8px;
  padding:5px 8px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--bg2);
  color:var(--muted);
  font-size:12px;
  font-weight:400;
  transition:color .2s,border-color .2s
}

.cp .ic {
  width:15px;
  height:15px
}

.cp:hover {
  color:var(--text);
  border-color:var(--gold)
}

.cp.ok {
  color:var(--pos);
  border-color:var(--pos)
}

.cp.big {
  margin:12px 0 0;
  padding:10px 14px;
  font-size:14px
}


/* ===== Campo com rótulo flutuante ===== */
.li {
  display:block;
  position:relative;
  margin-top:10px
}

.li input {
  margin-top:0;
  padding:23px 14px 7px;
  transition:border-color .2s
}

.li input:focus {
  outline:0;
  border-color:var(--gold)
}

.li span {
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
  transition:top .18s,font-size .18s,color .18s,transform .18s
}

.li input:focus+span,.li input:not(:placeholder-shown)+span {
  top:9px;
  transform:none;
  font-size:11px
}

.li input:focus+span {
  color:var(--gold)
}


/* ===== Fundo de raios de luz e tipografia ===== */
#rays {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  filter:blur(8px);
  -webkit-mask-image:linear-gradient(#000 35%,transparent 95%);
  mask-image:linear-gradient(#000 35%,transparent 95%)
}

#app {
  position:relative;
  z-index:1
}

nav {
  z-index:5
}

.serif {
  font-family:"Instrument Serif",ui-serif,Georgia,serif;
  font-style:italic;
  font-weight:400;
  font-size:1.12em;
  letter-spacing:-.01em
}

.reg {
  font-weight:400
}

.act.pix,.sb,.tx.px .m span:first-child {
  font-weight:600
}

.tx.it .m span,.rec .it {
  font-family:"Instrument Serif",ui-serif,Georgia,serif;
  font-style:italic;
  font-size:1.08em
}

.tx>b {
  text-align:right;
  white-space:nowrap
}


/* ===== Janela flutuante ===== */
#modal {
  align-items:center;
  padding:16px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px)
}

.rec {
  border:1px solid var(--line);
  border-radius:26px;
  max-height:calc(100% - 32px);
  padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.45)
}

.win-h {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:4px
}

.win-h h3 {
  font-size:22px;
  font-weight:600;
  letter-spacing:-.03em
}

.x {
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  flex:none;
  color:var(--muted)
}

.x:hover {
  color:var(--text);
  border-color:var(--gold)
}

.sum {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding:12px 14px;
  border-radius:14px;
  background:var(--bg2);
  border:1px solid var(--line);
  font-size:14px
}

.sel {
  display:block;
  margin-top:10px
}

.sel span {
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:0 0 4px 4px
}

select {
  width:100%;
  padding:13px 14px;
  border-radius:14px;
  background:var(--bg2);
  border:1px solid var(--line);
  color:var(--text);
  font:inherit
}

select:focus {
  outline:0;
  border-color:var(--gold)
}

.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}


/* ===== Início: ícones formais, bancos, rendimento e carrosséis ===== */
nav {
  grid-template-columns:repeat(5,1fr)
}

.ibtn {
  position:relative;
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--bg2);
  border:1px solid var(--line);
  color:var(--muted);
  transition:color .2s,border-color .2s
}

.ibtn:hover {
  color:var(--text);
  border-color:var(--gold)
}

.ibtn .ic {
  width:19px;
  height:19px;
  stroke-width:1.6
}

.badge {
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:9px;
  background:var(--neg);
  color:#fff;
  font:600 11px/18px Inter,sans-serif;
  text-align:center;
  font-style:normal
}

.bks {
  gap:12px;
  margin:18px 0 4px
}

.bk {
  position:relative
}

.bki {
  display:inline-grid;
  place-items:center;
  width:44px;
  height:44px;
  border-radius:50%;
  color:#fff;
  font:700 14px Inter,sans-serif;
  letter-spacing:-.02em;
  flex:none;
  border:1px solid var(--line)
}

.dot {
  position:absolute;
  right:0;
  bottom:0;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--pos);
  border:2px solid var(--bg)
}

.yield {
  position:relative;
  height:22px;
  overflow:hidden;
  margin-top:6px;
  font-size:14px
}

.yield>div {
  position:absolute;
  inset:0;
  white-space:nowrap;
  transition:opacity .6s,transform .6s
}

.yield .bb {
  opacity:0;
  transform:translateY(10px)
}

.yield.b .a {
  opacity:0;
  transform:translateY(-10px)
}

.yield.b .bb {
  opacity:1;
  transform:none
}

.g {
  color:var(--pos);
  font-weight:600
}

.g .ic {
  width:14px;
  height:14px;
  vertical-align:-2px;
  stroke-width:2.4
}

.car {
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  margin:0 -18px;
  padding:2px 18px 8px;
  scrollbar-width:none
}

.car::-webkit-scrollbar {
  display:none
}

.cc {
  flex:none;
  width:200px;
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  text-align:left;
  padding:16px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  transition:border-color .2s
}

.cc:hover {
  border-color:var(--gold)
}

.cc .muted {
  font-size:12px
}

.ci {
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--bg2);
  border:1px solid var(--line);
  margin-bottom:4px
}


/* ===== Carrossel com setas e arrastar ===== */
.carw {
  position:relative
}

.car {
  overscroll-behavior-x:contain;
  cursor:grab;
  -webkit-overflow-scrolling:touch
}

.car.drag {
  cursor:grabbing;
  scroll-snap-type:none;
  user-select:none
}

.cnav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  border:0;
  box-shadow:none;
  color:var(--text);
  opacity:.65;
  transition:opacity .2s
}

.cnav.l {
  left:-8px
}

.cnav.r {
  right:-8px
}

.cnav:hover {
  opacity:1
}

.cnav .ic {
  width:18px;
  height:18px
}

.cnav .ic {
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))
}


/* ===== Barra com 6 abas, patrimônio e menu Mais ===== */
nav {
  grid-template-columns:repeat(6,1fr);
  padding-left:4px;
  padding-right:4px
}

nav a {
  font-size:10.5px;
  padding:6px 2px
}

.pat {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px
}

.pb {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  padding:10px;
  border-radius:14px;
  background:var(--bg2);
  border:1px solid var(--line);
  text-align:left;
  min-width:0;
  transition:border-color .2s
}

.pb:hover {
  border-color:var(--gold)
}

.pb .muted {
  font-size:11px
}

.pb b {
  font-size:13px;
  font-weight:600;
  letter-spacing:-.02em;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis
}

.ml {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden
}

.mi {
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:14px 16px;
  text-align:left;
  border-bottom:1px solid var(--line)
}

.mi:last-child {
  border-bottom:0
}

.mi:hover {
  background:var(--bg2)
}

.mi>span {
  flex:1;
  min-width:0
}

.mi>span b {
  display:block;
  font-weight:500
}

.mi .muted {
  font-size:12px
}

.mi .ic {
  color:var(--muted)
}

.mi .ic:last-child {
  width:18px;
  height:18px
}

.mi.out,.mi.out .ic {
  color:var(--neg)
}


/* ===== Responsivo: celular, tablet e computador ===== */
html {
  -webkit-text-size-adjust:100%
}

.rec {
  max-height:calc(100dvh - 32px)
}


/* ===== Celular: 16px nos campos evita o zoom automático do iOS ===== */
@media(max-width:599px) {
  input,select {
    font-size:16px
  }
  #app {
    padding-left:16px;
    padding-right:16px
  }
  .car {
    margin:0 -16px;
    padding-left:16px;
    padding-right:16px
  }
}


/* ===== Tablet: mesma coluna do celular, um pouco mais larga ===== */
@media(min-width:600px) and (max-width:899px) {
  #app,nav,.rec {
    max-width:560px
  }
}


/* ===== Computador: menu lateral fixo + conteúdo centralizado e mais largo ===== */
@media(min-width:900px) {
  body {
    padding:0
  }
  #app {
    max-width:none;
    margin:0;
    border:0;
    border-radius:0;
    min-height:100%;
    padding:36px 40px 56px
  }
  #app:has(>nav) {
    padding-left:272px
  }
  #app>*:not(nav) {
    max-width:820px;
    margin-left:auto;
    margin-right:auto
  }
  #app:not(:has(>nav))>*:not(nav) {
    max-width:440px
  }
  #app>nav {
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    transform:none;
    width:240px;
    max-width:none;
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:4px;
    padding:28px 14px;
    border-top:0;
    border-right:1px solid var(--line)
  }
  #app>nav a {
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-items:unset;
    gap:12px;
    padding:12px 14px;
    font-size:14px;
    border-radius:12px
  }
  #app>nav a:hover {
    background:var(--card);
    color:var(--text)
  }
  #app>nav a.on {
    background:var(--card);
    color:var(--text)
  }
  .acts {
    grid-template-columns:repeat(8,1fr)
  }
  .tilt {
    max-width:420px
  }
  .rec {
    max-width:520px
  }
  #toast {
    bottom:28px;
    left:calc(50% + 120px)
  }
}

@media(min-width:1280px) {
  #app>*:not(nav) {
    max-width:900px
  }
}


/* ===== Spinner (carregamento) ===== */
.spn {
  flex:none;
  display:inline-block;
  vertical-align:middle
}

.spn line {
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  animation:spf 1s linear infinite
}

@keyframes spf {
  0% {
    opacity:1
  }
  100% {
    opacity:.15
  }
}

#load {
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px)
}

#load.on {
  display:flex
}

#load .lc {
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 22px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:0 16px 40px rgba(0,0,0,.4);
  font-size:14px
}

.btn.ld {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  opacity:.85;
  cursor:wait
}

.sync {
  display:none;
  margin-left:8px;
  vertical-align:-2px;
  color:var(--muted)
}

body.syncing .sync {
  display:inline-block
}


/* ===== Início no padrão dos bancos digitais ===== */
.balb {
  display:block;
  width:100%;
  text-align:left;
  margin-top:18px;
  color:inherit
}

.balb .ic {
  width:18px;
  height:18px;
  color:var(--muted)
}

.balb .yield {
  display:block
}

.balb .yield>span {
  position:absolute;
  inset:0;
  white-space:nowrap;
  transition:opacity .6s,transform .6s
}

.balb .yield .bb {
  opacity:0;
  transform:translateY(10px)
}

.balb .yield.b .a {
  opacity:0;
  transform:translateY(-10px)
}

.balb .yield.b .bb {
  opacity:1;
  transform:none
}

.qas {
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin:20px -18px 0;
  padding:2px 18px 6px;
  scrollbar-width:none
}

.qas::-webkit-scrollbar {
  display:none
}

.qa {
  flex:none;
  width:72px;
  display:grid;
  justify-items:center;
  gap:8px;
  font-size:12px;
  text-align:center
}

.qi {
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  flex:none;
  transition:border-color .2s,transform .15s
}

.qa:hover .qi,.rw:hover .qi {
  border-color:var(--gold)
}

.qa:active .qi {
  transform:scale(.94)
}

.rw {
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:14px 16px;
  text-align:left;
  border-bottom:1px solid var(--line);
  transition:background .2s
}

.rw:last-child {
  border-bottom:0
}

.rw:hover {
  background:var(--bg2)
}

.rw .qi {
  width:42px;
  height:42px
}

.rt {
  flex:1;
  min-width:0
}

.rt b {
  display:block;
  font-weight:500
}

.rt .muted {
  font-size:12px
}

.rv {
  font-weight:600;
  white-space:nowrap
}

.rw>.ic:last-child {
  width:18px;
  height:18px;
  color:var(--muted)
}

.sec {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:26px 0 12px
}

.sec h2 {
  margin:0
}

.sec button {
  color:var(--muted);
  font-size:13px
}

.sec button:hover {
  color:var(--text)
}

.trust {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:30px;
  font-size:12px;
  color:var(--muted);
  text-align:center
}

.trust .ic {
  width:15px;
  height:15px;
  flex:none
}

@media(min-width:600px) {
  .qas {
    margin-left:0;
    margin-right:0;
    padding-left:0;
    padding-right:0;
    flex-wrap:wrap;
    overflow:visible
  }
  .qa {
    width:84px
  }
}


/* ===== Tela de entrada no padrão dos bancos ===== */
.auth {
  max-width:380px;
  margin:0 auto;
  padding-bottom:20px
}

.brand {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin:min(10vh,72px) 0 30px

const PROD=[{id:'tsel',nome:'Tesouro Selic',pct:100,carencia:0,desc:'Liquidez diária · 100% do CDI'},{id:'cdb100',nome:'CDB RootBank',pct:100,carencia:0,desc:'Liquidez diária · 100% do CDI'},{id:'cdb110',nome:'CDB RootBank Turbo',pct:110,carencia:90,desc:'Carência de 90 dias · 110% do CDI'},{id:'lci',nome:'LCI RootBank',pct:92,carencia:60,desc:'Carência de 60 dias · 92% do CDI, isenta de IR'}];
const COINS=[['BTC','Bitcoin',560000],['ETH','Ethereum',19000],['SOL','Solana',950],['USDT','Tether',5.45]];
const PX={},PX0={};COINS.forEach(c=>{PX[c[0]]=c[2];PX0[c[0]]=c[2]});
function tick(){COINS.forEach(c=>{PX[c[0]]*=1+(Math.random()-.5)*(c[0]=='USDT'?.0004:.006)})}

function norm(u){
  if(!u.cofres)u.cofres=[{id:'c0',nome:'Reserva',meta:0,valor:u.guard||0}];
  u.inv=u.inv||[];u.cripto=u.cripto||{};u.cost=u.cost||{};u.links=u.links||[];u.bols=u.bols||[];u.conn=u.conn||{};
  if(!u.sd){u.sd=1;if(!u.inv.length&&!Object.keys(u.cripto).length)seedPort(u,u.email=='demo@rootbank.com'?1:.2)}
  if(u.seen==null)u.seen=Date.now();return u;
}
const syncG=u=>{u.guard=u.cofres.reduce((s,c)=>s+c.valor,0)};
const valorInv=p=>Math.round(p.v*Math.pow(1+dia,(Date.now()-p.t)/864e5*p.pct/100));
// quanto o saldo em conta rendeu nos últimos 12 meses a 100% do CDI, refazendo o saldo de cada dia
function rend12(u){
  const D=864e5,fim=Date.now();let tot=0;
  for(let d=364;d>=0;d--){const t=fim-d*D,bal=u.saldo-u.tx.filter(x=>x.t>t).reduce((s,x)=>s+x.v,0);if(bal>0)tot+=bal*dia}
  return Math.round(tot);
}
// carteira inicial: investimentos aplicados há meses e moedas compradas abaixo do preço atual (k = tamanho da carteira)
function seedPort(u,k){
  const D=864e5,now=Date.now();
  [['tsel',3000,120],['cdb100',5000,200],['lci',2000,95]].forEach(([id,v,d])=>{const p=PROD.find(x=>x.id==id);u.inv.push({id:'s'+id,nome:p.nome,pct:p.pct,carencia:p.carencia,v:Math.round(v*k*100),t:now-d*D})});
  [['BTC',.0042,.78],['ETH',.21,.86],['SOL',3.4,.9]].forEach(([s,q,f])=>{u.cripto[s]=q*k;u.cost[s]=q*k*PX[s]*f});
}

function genBoleto(v,venc){
  const d=new Date(venc+'T00:00:00'),b25=new Date('2025-02-22T00:00:00'),b97=new Date('1997-10-07T00:00:00');
  const fator=String((d>=b25?1000+Math.round((d-b25)/864e5):Math.round((d-b97)/864e5))%10000).padStart(4,'0');
  const cl=Array.from({length:25},()=>Math.floor(Math.random()*10)).join(''),v10=String(v).padStart(10,'0');
  const b43='9999'+fator+v10+cl;let s=0,m=2;for(let i=42;i>=0;i--){s+=b43[i]*m;m=m==9?2:m+1}
  let dv=11-s%11;if(dv==0||dv>9)dv=1;

  const f=(x,y)=>x.slice(0,5)+'.'+x.slice(5)+y;
  return `${f(f1,mod10(f1))} ${f(f2,mod10(f2))} ${f(f3,mod10(f3))} ${dv} ${fator}${v10}`;
}

}

function runOp(k,f,u){
  if(!NOPIN.includes(k)&&hash(f.pin)!=(u.pin||hash('1234')))return 'PIN incorreto.';
  if(k=='pin'){if(!/^\d{4}$/.test(f.novo))return 'O novo PIN precisa ter 4 dígitos.';u.pin=hash(f.novo);return {msg:'PIN alterado'}}

  if(k=='novoc'){const n=f.nome.trim();if(n.length<2)return 'Dê um nome ao cofrinho.';const meta=cents(f.meta||'');u.cofres.push({id:'c'+Date.now(),nome:n,meta:meta>0?meta:0,valor:0});return {msg:'Cofrinho criado'}}

    const id=Math.random().toString(36).slice(2,8);u.links.unshift({id,desc:f.desc.trim(),v,n:+f.parc,exp:Date.now()+f.dias*864e5,status:'Aguardando',url:'https://rootbank.link/'+id});return {again:'link'}}
  if(k=='bol'){const v=cents(f.valor),d=digits(f.doc);if(f.nome.trim().length<3)return 'Informe o nome do pagador.';if(!docOk(d))return 'CPF ou CNPJ do pagador inválido.';if(!(v>0))return 'Informe um valor maior que zero.';
    if(f.venc<new Date().toISOString().slice(0,10))return 'O vencimento não pode ser no passado.';
    u.bols.unshift({id:Math.random().toString(36).slice(2,8),nome:f.nome.trim(),doc:d,v,venc:f.venc,linha:genBoleto(v,f.venc),status:'Em aberto'});return {again:'bol'}}
  let v=cents(f.valor||''),t,ch;
  if(k=='boleto'){const d=digits(f.dest);
    if(d.length==47){if(mod10(d.slice(0,9))!=d[9]||mod10(d.slice(10,20))!=d[20]||mod10(d.slice(21,31))!=d[31])return 'Linha digitável inválida. Confira os números do boleto.';const emb=parseInt(d.slice(37))||0;if(emb>0)v=emb}
    else if(d.length!=48)return 'A linha digitável precisa ter 47 ou 48 dígitos.'}
  if(!(v>0))return 'Informe um valor maior que zero.';

    const hoje=u.tx.filter(x=>x.tipo=='Pix'&&x.v<0&&x.t>Date.now()-864e5).reduce((s,x)=>s-x.v,0);
    if(hoje+v>LIM_PIX)return `Limite diário de Pix: ${brl(LIM_PIX)}. Você ainda pode enviar ${brl(Math.max(0,LIM_PIX-hoje))} hoje.`;
    t=addTx(u,'Pix para '+ch+(f.msg&&f.msg.trim()?' · '+f.msg.trim():''),-v,'Outros','Pix');t.dest=ch;t.tp=f.tp}
  else if(k=='boleto')t=addTx(u,'Boleto '+digits(f.dest).slice(0,5)+'…'+digits(f.dest).slice(-4),-v,'Outros','Boleto');

    if(!/^\d{4}$/.test(f.ag.trim()))return 'A agência precisa ter 4 números.';
    if(!/^\d{4,12}$/.test(digits(f.conta)))return 'Conta inválida. Informe de 4 a 12 números, com o dígito.';
    t=addTx(u,'Transferência para '+f.nome.trim(),-v,'Outros','Transferência');t.dest=f.banco+' · ag '+f.ag.trim()+' · '+f.tc+' '+digits(f.conta)}
  else if(k=='dep')t=addTx(u,{boleto:'Depósito por boleto',pix:'Depósito por Pix',debito:'Depósito com cartão de débito'}[f.forma],v,'Renda','Depósito');
  else if(k=='guardar'){const c=u.cofres.find(x=>x.id==f.cf);if(!c)return 'Escolha um cofrinho.';c.valor+=v;syncG(u);t=addTx(u,'Guardado em '+c.nome,-v,'Outros','Cofrinho')}
  else if(k=='resgatar'){const c=u.cofres.find(x=>x.id==f.cf);if(!c)return 'Escolha um cofrinho.';if(v>c.valor)return 'Valor maior que o disponível neste cofrinho.';c.valor-=v;syncG(u);t=addTx(u,'Resgate de '+c.nome,v,'Renda','Cofrinho')}
  else if(k=='invest'){const p=PROD.find(x=>x.id==f.p);if(!p)return 'Escolha um produto.';if(v<100)return 'Aplicação mínima de R$ 1,00.';
    t=addTx(u,'Aplicação · '+p.nome,-v,'Outros','Investimento');u.inv.push({id:Math.random().toString(36).slice(2,8),nome:p.nome,pct:p.pct,carencia:p.carencia,v,t:Date.now()})}
  else if(k=='resgatarinv'){const p=u.inv.find(x=>x.id==f.pi);if(!p)return 'Você não tem investimentos para resgatar.';const dias=(Date.now()-p.t)/864e5;
    if(dias<p.carencia)return `Disponível para resgate em ${Math.ceil(p.carencia-dias)} dias.`;
    const cur=valorInv(p);if(v>cur+1)return `Valor maior que o disponível: ${brl(cur)}.`;
    if(v>=cur-1){u.inv=u.inv.filter(x=>x.id!=p.id);v=cur}else p.v=Math.round(p.v*(1-v/cur));
    t=addTx(u,'Resgate · '+p.nome,v,'Renda','Investimento')}
  else if(k=='comprar'){const px=PX[f.m];if(!px)return 'Moeda inválida.';u.cripto[f.m]=(u.cripto[f.m]||0)+(v/100)*.995/px;u.cost[f.m]=(u.cost[f.m]||0)+v/100;t=addTx(u,'Compra de '+f.m,-v,'Outros','Cripto')}
  else if(k=='vender'){const px=PX[f.m],have=(u.cripto[f.m]||0)*px*100;if(!px)return 'Moeda inválida.';if(v>have+1)return `Você tem ${brl(Math.round(have))} em ${f.m}.`;
    const q0=u.cripto[f.m]||0,vq=(v/100)/px;u.cost[f.m]=(u.cost[f.m]||0)*(1-Math.min(1,vq/(q0||1)));u.cripto[f.m]=Math.max(0,q0-vq);t=addTx(u,'Venda de '+f.m,Math.round(v*.995),'Renda','Cripto')}
  else if(k=='emp'){const n=parseInt(f.parc),i=.025,pm=Math.round(v*i/(1-Math.pow(1+i,-n)));(u.loans=u.loans||[]).push({v,n,pm});t=addTx(u,`Crédito ${n}x de ${brl(pm)}`,v,'Renda','Empréstimo')}
  return {t};
}

async function onSubmit(e){
  const f=Object.fromEntries(new FormData(e.target));if(e.target.dataset&&e.target.dataset.k=='simul')return;
  const fm=e.target;
  await spin(fm.id=='fin'?'Entrando…':fm.id=='fup'?'Criando sua conta…':(OPM[fm.dataset.k]||'Processando…'),fm.querySelector('.btn'),600);
  if(fm.id=='fin')Store.set('rb_cpf',f.lembrar&&digits(f.id).length==11?digits(f.id):null);
  if(e.target.id=='fin'){
    const id=f.id.trim().toLowerCase(),u=db.users.find(x=>x.email==id||(digits(id)&&x.cpf==digits(id)));
    if(!u)return err('Conta não encontrada. Confira o CPF ou e-mail, ou abra uma conta.');
    if(Date.now()<u.lock)return err('Muitas tentativas. Aguarde alguns segundos e tente de novo.');
    if(u.h!=hash(f.senha)){u.fails++;if(u.fails>=5){u.lock=Date.now()+30000;u.fails=0}save();return err('Senha incorreta.')}
    u.fails=0;db.sess=u.id;save();location.hash='#/home';render();
  }else if(e.target.id=='fop'){
    const r=runOp(e.target.dataset.k,f,me());if(typeof r=='string')return err(r);
    save();render();
    if(r.again)return openOp(r.again,me());if(r.bank)return openBank(r.bank,me());
    $('#modal').classList.remove('on');
    if(r.t){$('#modal').innerHTML=receipt(r.t);$('#modal').classList.add('on')}else toast(r.msg||'Pronto');
  }else if(e.target.id=='fup'){
    if(f.nome.trim().split(/\s+/).length<2)return err('Informe nome e sobrenome.');
    if(!cpfOk(f.cpf))return err('CPF inválido. Confira os 11 dígitos.');
    if(!/^\S+@\S+\.\S+$/.test(f.email))return err('E-mail inválido.');
    if(!/^\d{4}$/.test(f.pin))return err('O PIN precisa ter exatamente 4 números.');
    if(f.senha.length<6)return err('A senha precisa ter ao menos 6 caracteres.');
    if(f.senha!=f.senha2)return err('As senhas não são iguais.');
    if(db.users.some(x=>x.cpf==digits(f.cpf)||x.email==f.email.toLowerCase()))return err('Já existe uma conta com esse CPF ou e-mail.');
    const u=mkUser(f.nome.trim(),f.cpf,f.email.trim(),f.senha,false,f.pin);db.users.push(u);db.sess=u.id;save();location.hash='#/home';render();toast('Conta criada! Bônus de R$ 1.000,00 recebido.');
  }
}

// ===== Fundo de raios de luz (equivalente ao Light Rays) =====
(function(){
  const cv=document.getElementById('rays');if(!cv)return;
  const cx=cv.getContext('2d'),N=11;
  // cada raio tem ângulo, largura, velocidade, fase e intensidade próprios
  const R=Array.from({length:N},(_,i)=>({a:(i/(N-1)-.5)*1.1+Math.sin(i*12.9)*.04,w:.05+.05*Math.abs(Math.sin(i*7.1)),f:.25+.35*Math.abs(Math.cos(i*3.3)),p:i*1.7,k:.5+.5*Math.abs(Math.sin(i*5.5))}));
  let W,H,raf;
  function size(){W=cv.width=Math.ceil(innerWidth/3);H=cv.height=Math.ceil(innerHeight/3);draw(performance.now())}
  function draw(t){
    const st=getComputedStyle(document.documentElement),c=st.getPropertyValue('--ray').trim()||'255,255,255',A=parseFloat(st.getPropertyValue('--rayA'))||.2;
    cx.clearRect(0,0,W,H);cx.globalCompositeOperation=A>.1?'lighter':'source-over';
    const ox=W*.5,oy=-H*.12,L=Math.hypot(W,H)*1.1;
    R.forEach(r=>{
      const ang=Math.PI/2+r.a+Math.sin(t*.0003*r.f+r.p)*.05,al=A*r.k*(.55+.45*Math.sin(t*.0008*r.f+r.p));
      const g=cx.createLinearGradient(ox,oy,ox+L*Math.cos(ang),oy+L*Math.sin(ang));
      g.addColorStop(0,`rgba(${c},${al})`);g.addColorStop(.75,`rgba(${c},0)`);
      cx.fillStyle=g;cx.beginPath();cx.moveTo(ox,oy);
      cx.lineTo(ox+L*Math.cos(ang-r.w/2),oy+L*Math.sin(ang-r.w/2));
      cx.lineTo(ox+L*Math.cos(ang+r.w/2),oy+L*Math.sin(ang+r.w/2));cx.closePath();cx.fill();
    });
  }
  function loop(t){if(!calmo())draw(t);raf=requestAnimationFrame(loop)}
  function start(){cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(loop)}
  addEventListener('resize',size);
  document.addEventListener('visibilitychange',start);
  new MutationObserver(()=>draw(performance.now())).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  size();start();
})();
